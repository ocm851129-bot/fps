<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TRIAD / 50대 영웅전</title>
<link rel="stylesheet" href="hero.css">
</head>
<body>
<header>
<a href="index.html">TRIAD <small>FPS 복귀</small>
</a>
<strong>50 VS HEROES</strong>
</header>
<canvas id="hero-game" aria-label="50대 영웅전">
</canvas>
<section id="hero-menu">
<p>CO-OP SPECIAL OPERATION</p>
<h1>AI 50명에 맞서<br>
<em>최대 12명의 영웅이 집결한다.</em>
</h1>
<label>캐릭터 이름<input id="hero-name" maxlength="12" value="고영훈">
</label>
<label>영웅 선택<select id="hero-role">
<option value="0">고영훈 · 사업 이사</option>
<option value="1">하헌민 · 영업 과장</option>
<option value="2">오대영 · 남원시 9급 공무원</option>
</select>
</label>
<button id="hero-public">공개 매칭 · 접속 순서대로 입장</button>
<button id="hero-solo">혼자 훈련 시작</button>
<button id="hero-create">비공개 초대방 생성</button>
<label>초대 URL<input id="hero-invite" placeholder="초대 URL 붙여넣기">
</label>
<button id="hero-join">초대 URL로 접속</button>
<div id="hero-status">대형 전장 1600 × 1600 · AI 50명</div>
<button id="hero-launch" hidden>협동 작전 시작</button>
<button id="hero-copy" hidden>새 초대 URL 복사</button>
</section>
<div id="hero-hud" hidden>
<b id="hero-alive">
</b>
<span id="hero-weapon">
</span>
<span id="hero-hp">
</span>
<button id="hero-switch">무기 전환</button>
</div>
<div id="hero-result" hidden>
<h2>
</h2>
<button onclick="location.reload()">다시 시작</button>
</div>
<script src="online-config.js">
</script>
<script type="module" src="vendor/hero-online.js">
</script>
</body>
</html>
